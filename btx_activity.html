<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTX — activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500;600;700&family=Roboto+Condensed:wght@700&display=swap">
<style>
:root{
  --bg:#000; --fg:#d4d4d4; --fg-bright:#fff;
  --muted:#888; --dim:#666;
  --border:#2a2a2a; --border-soft:#1f1f1f;
  --hover:#1a1a1a; --panel:#0d0d0d;
  --line-strong:#555;
  --orange:#ff8c00; --orange-bright:#ffaa33;
  --red:#f0616d; --red-bg:#1a0e0e; --red-border:#5e2e34;
  --green:#26a69a; --green-bg:#0e1a16; --green-border:#1a4940;
  --font-mono:'Source Code Pro', Consolas, Menlo, monospace;
  --font-display:'Roboto Condensed', system-ui, sans-serif;
}
*{margin:0; padding:0; box-sizing:border-box}
::selection{ background:var(--orange); color:#000 }
html,body{ height:100%; background:var(--bg); color:var(--fg); font-family:var(--font-mono); font-size:13px; font-variant-numeric:tabular-nums; line-height:1.45 }
button{ font-family:inherit; cursor:pointer }
a{ color:var(--fg); text-decoration:none }

.nav{ display:flex; align-items:center; gap:8px; padding:8px 14px; background:var(--bg); border-bottom:1px solid var(--border) }
.logo{ display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--fg-bright); text-transform:uppercase; letter-spacing:.8px; padding:0 10px 0 2px }
.logo::before{ content:""; display:inline-block; width:18px; height:18px; background:var(--orange); border-radius:3px; background-image:linear-gradient(135deg, var(--orange) 60%, var(--orange-bright) 100%) }
.navlinks{ display:flex; gap:2px; margin-left:6px }
.navlinks a{ color:var(--fg); padding:6px 12px; font-size:12px; border-radius:3px; text-transform:uppercase; letter-spacing:.5px; cursor:pointer }
.navlinks a:hover{ background:var(--hover); color:var(--fg-bright) }
.navlinks a.on{ background:var(--hover); color:var(--fg-bright) }
.navright{ margin-left:auto; display:flex; align-items:center; gap:6px }
.pill{ display:inline-flex; align-items:center; background:var(--hover); color:var(--fg); border:1px solid var(--line-strong); border-radius:2px; height:28px; padding:0 10px; font-size:11px; text-transform:uppercase; letter-spacing:.5px; line-height:26px }
.pill.ok  { color:var(--green); border-color:#2c5e57 }
.pill.bad { color:var(--red); border-color:var(--red-border) }
.pill.warn{ color:var(--orange); border-color:#7a4b13 }

.header{ display:flex; align-items:baseline; gap:18px; padding:14px 18px; border-bottom:1px solid var(--border) }
.header h1{ font-family:var(--font-display); font-weight:700; font-size:20px; color:var(--fg-bright); text-transform:uppercase; letter-spacing:.6px }
.header .sub{ font-size:11.5px; color:var(--muted) }
.header .right{ margin-left:auto; display:flex; gap:10px; align-items:center }

.filters{ display:flex; gap:6px; padding:10px 18px; border-bottom:1px solid var(--border); background:var(--bg) }
.filters button{
  background:transparent; color:var(--muted); border:1px solid var(--border);
  padding:5px 11px; border-radius:2px; font-size:11px;
  text-transform:uppercase; letter-spacing:.5px;
}
.filters button:hover{ border-color:var(--line-strong); color:var(--fg-bright) }
.filters button.on{ background:var(--orange); color:#000; border-color:var(--orange) }
.filters .count{ margin-left:auto; font-size:11px; color:var(--dim); align-self:center }

.activity{ display:flex; flex-direction:column }
.row{
  display:grid;
  grid-template-columns: 26px 1.8fr 1.2fr 1fr 110px 100px;
  gap:14px; align-items:center;
  padding:11px 18px; border-bottom:1px solid var(--border-soft);
  font-size:12.5px;
}
.row:hover{ background:var(--hover) }
.row .ic{
  width:24px; height:24px; border-radius:3px;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700;
}
.row .ic.recv  { background:var(--green-bg); color:var(--green); border:1px solid var(--green-border) }
.row .ic.send  { background:var(--red-bg);   color:var(--red);   border:1px solid var(--red-border) }
.row .ic.swap  { background:#1a0e00;         color:var(--orange);border:1px solid #7a4b13 }
.row .ic.gen   { background:var(--panel);    color:var(--muted); border:1px solid var(--border) }
.row .desc .t{ color:var(--fg-bright); font-size:12.5px }
.row .desc .m{ font-size:10.5px; color:var(--muted); margin-top:2px; font-family:var(--font-mono); word-break:break-all }
.row .addr{ font-family:var(--font-mono); color:var(--muted); font-size:11.5px; word-break:break-all }
.row .amt{ text-align:right; font-size:13px; font-weight:500 }
.row .amt.g{ color:var(--green) }
.row .amt.r{ color:var(--red) }
.row .when{ font-size:11px; color:var(--muted); text-align:right }
.row .st{ font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; text-align:right }
.row .st.ok   { color:var(--green) }
.row .st.pend { color:var(--orange) }
.row .st.imm  { color:var(--dim) }

.empty{ padding:50px 24px; text-align:center; color:var(--dim); font-size:12px }
.empty b{ color:var(--fg); font-weight:600 }

.statusbar{
  display:flex; align-items:center; gap:18px;
  padding:5px 14px; background:var(--bg);
  border-top:1px solid var(--border);
  font-size:11.5px; color:var(--muted);
}
.statusbar .live{ display:flex; align-items:center; gap:6px; color:var(--green) }
.statusbar .live .dot{ width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block }
.statusbar .live .dot.bad{ background:var(--red) }
.statusbar .right{ margin-left:auto; display:flex; gap:14px }
</style>
</head>
<body>

<div class="nav">
  <div class="logo">BTX</div>
  <div class="navlinks">
    <a href="/">Trade</a>
    <a href="/btx_book.html">Book</a>
    <a href="/btx_trades.html">Trades</a>
    <a href="/btx_create.html">Create</a>
    <a href="/btx_wallet.html">Wallet</a>
    <a class="on">Activity</a>
    <a href="https://github.com/renshuBTC" target="_blank" rel="noopener">Docs</a>
  </div>
  <div class="navright">
    <span class="pill" id="chainPill">…</span>
    <span class="pill" id="syncPill">…</span>
  </div>
</div>

<div class="header">
  <h1>Activity</h1>
  <span class="sub">BTC wallet history merged with BTX on-chain fills</span>
  <div class="right">
    <button class="pill" id="refreshBtn" style="cursor:pointer">Refresh</button>
  </div>
</div>

<div class="filters">
  <button class="on" data-filter="all">All</button>
  <button data-filter="recv">Received</button>
  <button data-filter="send">Sent</button>
  <button data-filter="swap">BTX fills</button>
  <span class="count" id="rowCount">—</span>
</div>

<div class="activity" id="rows">
  <div class="empty">loading…</div>
</div>

<div class="statusbar">
  <span class="live"><span class="dot" id="liveDot"></span><span id="liveTxt">connecting…</span></span>
  <span class="right">
    <span>L1 only</span>
    <span id="rightInfo">—</span>
  </span>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtBtc = n => (Math.abs(Number(n)) || 0).toFixed(8);
const shortTxid = (s, n) => s ? (s.length > n*2 ? s.slice(0, n) + '…' + s.slice(-n) : s) : '';
const fmtWhen = ts => {
  if (!ts) return '—';
  const d = new Date(ts * 1000);
  const now = Date.now();
  const ageSec = (now - d.getTime()) / 1000;
  if (ageSec < 60) return Math.floor(ageSec) + 's ago';
  if (ageSec < 3600) return Math.floor(ageSec/60) + 'm ago';
  if (ageSec < 86400) return Math.floor(ageSec/3600) + 'h ago';
  return d.toLocaleDateString();
};

let currentFilter = 'all';
let lastRows = [];

async function getJson(path){
  try{ const r = await fetch(path, { cache:'no-store' }); if(!r.ok) return null; return await r.json(); }
  catch(e){ console.error('GET', path, e); return null; }
}

function setPill(el, cls, txt){ el.className = 'pill ' + cls; el.textContent = txt; }
function setLive(ok, txt){ $('liveDot').classList.toggle('bad', !ok); $('liveTxt').textContent = txt; }

function classifyTx(r){
  // Map Core's listtransactions row + BTX fill into a single internal type.
  if (r._kind === 'btx_fill') return 'swap';
  if (r.category === 'receive') return 'recv';
  if (r.category === 'send')    return 'send';
  if (r.category === 'generate' || r.category === 'immature') return 'gen';
  return 'recv';
}

function renderRow(r){
  const kind = classifyTx(r);
  const iconChar = { recv:'↓', send:'↑', swap:'⇄', gen:'⛏' }[kind] || '·';
  const ts = r.blocktime || r.time || r._ts;
  const conf = r.confirmations;
  const amount = Number(r.amount || 0);
  const amtClass = amount > 0 ? 'g' : (amount < 0 ? 'r' : '');
  const amtPrefix = amount > 0 ? '+' : (amount < 0 ? '−' : '');
  let stateText, stateClass;
  if (conf == null) { stateText = '—'; stateClass = 'imm'; }
  else if (conf === 0) { stateText = 'mempool'; stateClass = 'pend'; }
  else if (conf < 6)   { stateText = conf + '/6'; stateClass = 'pend'; }
  else                  { stateText = 'confirmed'; stateClass = 'ok'; }
  const title = {
    recv: 'Received BTC',
    send: 'Sent BTC',
    swap: 'BTX on-chain fill',
    gen:  'Coinbase / generated'
  }[kind] || kind;

  return `
    <div class="row" data-kind="${kind}">
      <div class="ic ${kind}">${iconChar}</div>
      <div class="desc">
        <div class="t">${esc(title)}${r.label ? ' — ' + esc(r.label) : ''}</div>
        <div class="m">${esc(shortTxid(r.txid, 8))}</div>
      </div>
      <div class="addr">${esc(shortTxid(r.address || '—', 8))}</div>
      <div class="amt ${amtClass}">${amtPrefix}${fmtBtc(amount)} BTC</div>
      <div class="when">${esc(fmtWhen(ts))}</div>
      <div class="st ${stateClass}">${esc(stateText)}</div>
    </div>
  `;
}

function rerender(){
  const filtered = lastRows.filter(r => {
    if (currentFilter === 'all') return true;
    return classifyTx(r) === currentFilter;
  });
  const c = $('rows');
  if (filtered.length === 0){
    c.innerHTML = '<div class="empty"><b>No activity yet.</b><br>Once you receive BTC, send sats, or fill a BTX order, it will show up here.</div>';
  } else {
    c.innerHTML = filtered.map(renderRow).join('');
  }
  $('rowCount').textContent = filtered.length + ' row' + (filtered.length === 1 ? '' : 's');
}

async function refresh(){
  // Chain + sync pills
  const node = await getJson('/api/node/status');
  if (node){
    setPill($('chainPill'), 'ok', node.chain || 'node');
    const prog = node.verificationprogress;
    if (prog >= 0.999) setPill($('syncPill'), 'ok', 'synced');
    else setPill($('syncPill'), 'warn', 'syncing ' + ((prog||0)*100).toFixed(1) + '%');
    $('rightInfo').textContent = (node.blocks ?? '—') + ' blocks';
  } else {
    setPill($('chainPill'), 'bad', 'no node');
    setPill($('syncPill'), 'bad', 'down');
  }

  // BTC wallet transactions
  const wallet = await getJson('/api/wallet/transactions');
  const btcRows = (wallet && wallet.transactions) ? wallet.transactions : [];

  // BTX fills — wrap each in a tagged row so the same renderer handles both
  // shapes. /api/dex/fills already returns most fields we need.
  const fillsResp = await getJson('/api/dex/fills');
  const fills = (fillsResp && fillsResp.fills) ? fillsResp.fills : [];
  const btxRows = fills.map(f => ({
    _kind: 'btx_fill',
    txid: f.txid || f.fill_txid,
    address: f.maker_addr || f.offer_addr || '',
    amount: 0,                       // fills don't move plain BTC into this wallet
    label: f.asset || f.rune || 'BTX',
    confirmations: f.confirmations,
    blocktime: f.blocktime || f.timestamp,
    time: f.timestamp,
    _ts: f.blocktime || f.timestamp,
  }));

  // Merge + sort newest first.
  lastRows = [...btcRows, ...btxRows].sort((a,b) => {
    const at = a.blocktime || a.time || a._ts || 0;
    const bt = b.blocktime || b.time || b._ts || 0;
    return bt - at;
  });

  setLive(true, btcRows.length + ' BTC tx · ' + btxRows.length + ' BTX fills');
  rerender();
}

// Filter buttons
document.querySelectorAll('.filters button[data-filter]').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.filters button[data-filter]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    currentFilter = b.dataset.filter;
    rerender();
  };
});

$('refreshBtn').onclick = refresh;

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
