[package]
name = "frost_probe"
version = "0.1.0"
edition = "2021"
description = "secp256kfun FROST t-of-n signing probe used by BTX's btx_xtest_vs_secp256kfun_frost.py"

[dependencies]
schnorr_fun = { version = "0.13", features = ["alloc"] }
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 1
